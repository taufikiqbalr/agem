        type: object
      metric:
        type: string
      source:
        type: string
      synced_at:
        type: string
      ts_utc:
        type: string
      unit:
        type: string
      value:
        type: number
      values:
        additionalProperties:
          format: float64
          type: number
        type: object
    type: object
  store.SleepSegmentResponse:
    properties:
      end_utc:
        type: string
      sleep_date:
        type: string
      source:
        type: string
      stage:
        type: string
      start_utc:
        type: string
      synced_at:
        type: string
      tz_offset_min:
        type: integer
    type: object
  store.SleepSummaryResponse:
    properties:
      awake_s:
        type: integer
      deep_s:
        type: integer
      device_id:
        type: string
      light_s:
        type: integer
      rem_s:
        type: integer
      score:
        type: integer
      sleep_date:
        type: string
      sleep_start_utc:
        type: string
      source:
        type: string
      stage_data:
        items:
          type: integer
        type: array
      synced_at:
        type: string
      total_sleep_s:
        type: integer
      tz_offset_min:
        type: integer
      wake_utc:
        type: string
    type: object
  store.Steps15mResponse:
    properties:
      calories:
        type: integer
      device_date:
        type: string
      distance_m:
        type: integer
      run_steps:
        type: integer
      sport_duration_s:
        type: integer
      synced_at:
        type: string
      time_index:
        type: integer
      ts_utc:
        type: string
      tz_offset_min:
        type: integer
      walk_steps:
        type: integer
