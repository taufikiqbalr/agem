openapi: 3.0.3
info:
  title: AGEM Backend API
  version: 1.0.0
  description: API for AGEM wearable users, devices, qring sensor data, sleep, and
    workouts.
servers:
- url: http://localhost:8080
  description: Local development
tags:
- name: Health
- name: Users
- name: Devices
- name: Pairings
- name: Steps
- name: Activity
- name: Metrics
- name: Events
- name: Sleep
- name: Workouts
- name: Wearable v3
paths:
  /healthz:
    get:
      tags:
      - Health
      summary: Health check
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
  /v1/users/:
    post:
      tags:
      - Users
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              email: user@example.com
              phone: '+6281234567890'
      responses:
        '201':
          description: Created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/users/{id}:
    get:
      tags:
      - Users
      summary: Get user by ID
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: User.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
      - Users
      summary: Update user
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              phone: '+6281312345678'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Users
      summary: Delete user
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/users/{user_id}/devices:
    post:
      tags:
      - Pairings
      summary: Pair device to user
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairDeviceRequest'
            example:
              device_id: 66a000000000000000000001
              nickname: Daily QRing
              is_primary: true
      responses:
        '201':
          description: Created pairing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDevice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
      - Pairings
      summary: List user devices
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Pairing list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDevice'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/user_devices/{id}:
    patch:
      tags:
      - Pairings
      summary: Update pairing
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDeviceRequest'
            example:
              nickname: Daily QRing Updated
              is_primary: true
              unpaired_at: '2026-07-27T12:00:00Z'
      responses:
        '200':
          description: Updated pairing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDevice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Pairings
      summary: Delete pairing
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/:
    post:
      tags:
      - Devices
      summary: Create device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
            example:
              vendor: QRing
              model: QRing Pro
              hw_rev: A1
              fw_rev: 1.0.0
              serial_number: QR-20260727-0001
              device_uid: qring-aa-bb-cc-01
      responses:
        '201':
          description: Created device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/{id}:
    get:
      tags:
      - Devices
      summary: Get device by ID
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
      - Devices
      summary: Update device
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
            example:
              fw_rev: 1.0.1
              last_seen_at: '2026-07-27T02:00:00Z'
      responses:
        '200':
          description: Updated device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Devices
      summary: Delete device
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/by_uid/{device_uid}:
    get:
      tags:
      - Devices
      summary: Get device by stable device UID
      parameters:
      - $ref: '#/components/parameters/DeviceUID'
      responses:
        '200':
          description: Device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/{device_id}/steps15m:
    post:
      tags:
      - Steps
      summary: Ingest 15-minute step points
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestSteps15mRequest'
            example:
              points:
              - ts_utc: '2026-07-27T00:00:00Z'
                device_date: '2026-07-27'
                time_index: 0
                tz_offset_min: 420
                walk_steps: 120
                run_steps: 10
                calories: 8
                distance_m: 95
                source: device
      responses:
        '200':
          $ref: '#/components/responses/Upserted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
      - Steps
      summary: List 15-minute step points by date
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: Step point list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Steps15mResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/{device_id}/steps/daily:
    get:
      tags:
      - Steps
      summary: Aggregate daily step totals
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/FromTime'
      - $ref: '#/components/parameters/ToTime'
      responses:
        '200':
          description: Daily step totals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StepsDailyRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/{device_id}/activity/daily:
    post:
      tags:
      - Activity
      summary: Upsert daily activity total
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyActivityRequest'
            example:
              device_date: '2026-07-27'
              tz_offset_min: 420
              total_steps: 130
              running_steps: 10
              calories: 8
              walk_distance_m: 95
              sport_duration_s: 600
              sleep_duration_s: 25200
              source: device
      responses:
        '200':
          description: Daily activity row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyActivityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
      - Activity
      summary: List daily activity totals
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Daily activity rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyActivityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/{device_id}/health/metrics:
    post:
      tags:
      - Metrics
      summary: Ingest health metric points
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestHealthMetricsRequest'
            example:
              points:
              - ts_utc: '2026-07-27T00:05:00Z'
                metric: heart_rate
                value: 72
                unit: bpm
                source: device
                metadata:
                  wearing: true
      responses:
        '200':
          $ref: '#/components/responses/Upserted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
      - Metrics
      summary: List health metric points
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/FromTime'
      - $ref: '#/components/parameters/ToTime'
      - $ref: '#/components/parameters/Metric'
      responses:
        '200':
          description: Health metric rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthMetricResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/{device_id}/events:
    post:
      tags:
      - Events
      summary: Ingest device events
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestDeviceEventsRequest'
            example:
              events:
              - ts_utc: '2026-07-27T00:10:00Z'
                event_type: battery
                source: device
                payload:
                  level: 88
                  charging: false
      responses:
        '200':
          $ref: '#/components/responses/Upserted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
      - Events
      summary: List device events
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/FromTime'
      - $ref: '#/components/parameters/ToTime'
      - $ref: '#/components/parameters/EventType'
      responses:
        '200':
          description: Device event rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceEventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/{device_id}/sleep/summary:
    post:
      tags:
      - Sleep
      summary: Upsert sleep summary
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SleepSummaryRequest'
            example:
              sleep_date: '2026-07-27'
              tz_offset_min: 420
              sleep_start_utc: '2026-07-26T15:00:00Z'
              wake_utc: '2026-07-26T22:00:00Z'
              total_sleep_s: 25200
              deep_s: 5400
              light_s: 14400
              awake_s: 900
              rem_s: 4500
              source: device
      responses:
        '200':
          description: Sleep summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SleepSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
      - Sleep
      summary: Get sleep summary by date
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: Sleep summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SleepSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/{device_id}/sleep/segments:
    post:
      tags:
      - Sleep
      summary: Ingest sleep segments
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestSleepSegmentsRequest'
            example:
              segments:
              - start_utc: '2026-07-26T15:00:00Z'
                end_utc: '2026-07-26T15:30:00Z'
                sleep_date: '2026-07-27'
                tz_offset_min: 420
                stage: light
                source: device
      responses:
        '200':
          $ref: '#/components/responses/Upserted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
      - Sleep
      summary: List sleep segments by date
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: Sleep segments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SleepSegmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/{device_id}/workouts:
    post:
      tags:
      - Workouts
      summary: Upsert workout
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutRequest'
            example:
              start_utc: '2026-07-27T01:00:00Z'
              end_utc: '2026-07-27T01:30:00Z'
              tz_offset_min: 420
              sport_type_id: 1
              duration_s: 1800
              distance_m: 2500
              calories: 160.5
              avg_hr: 128
              max_hr: 150
              min_hr: 90
              steps: 3000
              locations:
              - rate_real: 128
              source: device
      responses:
        '201':
          description: Workout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
      - Workouts
      summary: List workouts
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/FromTime'
      - $ref: '#/components/parameters/ToTime'
      responses:
        '200':
          description: Workout list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
      - Workouts
      summary: Update workout by start time in body
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutRequest'
            example:
              start_utc: '2026-07-27T01:00:00Z'
              end_utc: '2026-07-27T01:30:00Z'
              tz_offset_min: 420
              sport_type_id: 1
              duration_s: 1800
              distance_m: 2500
              calories: 160.5
              avg_hr: 128
              max_hr: 150
              min_hr: 90
              steps: 3000
              locations:
              - rate_real: 128
              source: device
      responses:
        '200':
          description: Workout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Workouts
      summary: Delete workout by start time
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/StartUTC'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v3/wearable/sync:
    post:
      tags:
      - Wearable v3
      summary: Sync wearable snapshot
      description: Stores a QRing-style daily wearable payload, preserves the recognized
        snapshot, and fans out summary data plus timestamped readings into MongoDB
        collections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WearableSyncRequest'
            example:
              deviceUid: qring-aa-bb-cc-01
              tzOffsetMin: 420
              hrv:
                current: 42
                average: 45
                readingsCount: 2
                lastUpdated: '2026-07-27T23:44:10.512Z'
                readings:
                - ts: '2026-07-27T23:43:10.123Z'
                  value: 41
                - ts: '2026-07-27T23:44:10.512Z'
                  value: 42
              heartRate:
                current: 77
                average: 74
                min: 58
                max: 112
                readingsCount: 2
                lastUpdated: '2026-07-27T23:44:10.512Z'
                readings:
                - ts: '2026-07-27T23:43:10.123Z'
                  value: 76
                - ts: '2026-07-27T23:44:10.512Z'
                  value: 77
              spo2:
                current: 97
                average: 96
                readingsCount: 1
                lastUpdated: '2026-07-27T23:44:10.512Z'
                readings:
                - ts: '2026-07-27T23:44:10.512Z'
                  value: 97
              temperature:
                current: 36.7
                average: 36.5
                raw: 36.72
                readingsCount: 1
                lastUpdated: '2026-07-27T23:44:10.512Z'
                readings:
                - ts: '2026-07-27T23:44:10.512Z'
                  value: 36.7
                  raw: 36.72
              stress:
                current: 30
                average: 34
                readingsCount: 1
                lastUpdated: '2026-07-27T23:44:10.512Z'
                readings:
                - ts: '2026-07-27T23:44:10.512Z'
                  value: 30
              activity:
                steps: 717
                calories: 28390.0
                distance: 493
                activeTime: 29
                lastUpdated: '2026-07-27T23:44:10.512Z'
                readings:
                - ts: '2026-07-27T08:00:00.000Z'
                  steps: 120
                  calories: 8
                  distance: 95
                  activeTime: 15
              sleep:
                totalMinutes: 431
                deepMinutes: 92
                lightMinutes: 268
                remMinutes: 61
                awakeMinutes: 10
                score: 78
                sleepStart: '2026-07-26T22:41:00.000Z'
                sleepEnd: '2026-07-27T05:52:00.000Z'
                lastUpdated: '2026-07-27T23:44:10.512Z'
                stageData:
                - 2
                - 2
                - 3
                - 3
                - 1
                - 1
                - 1
                - 2
                - 4
                segments:
                - start: '2026-07-26T22:41:00.000Z'
                  end: '2026-07-26T23:11:00.000Z'
                  stage: light
              bloodPressure:
                systolic: 118
                diastolic: 76
                heartRate: 72
                measurementTime: '2026-07-27T07:12:00.000Z'
                lastUpdated: '2026-07-27T23:44:10.512Z'
                readings:
                - ts: '2026-07-27T07:12:00.000Z'
                  systolic: 118
                  diastolic: 76
                  heartRate: 72
              totalActivities:
              - kind: steps
                value: 717.0
                target: 4000.0
              - kind: calories
                value: 28.39
                target: 500.0
              - kind: distance
                value: 0.493
                target: 4.0
      responses:
        '200':
          description: Sync result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WearableSyncResponse'
              example:
                status: synced
                device_id: 66a000000000000000000001
                device_uid: qring-aa-bb-cc-01
                sync_date: '2026-07-27'
                upserted:
                  snapshot: 1
                  health_metrics: 14
                  daily_activity: 1
                  steps_15m: 1
                  sleep_summary: 1
                  sleep_segments: 1
                  total_activities: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /v3/wearable/range:
    get:
      tags:
      - Wearable v3
      summary: List synced wearable snapshots
      description: Returns QRing-style daily wearable snapshots in ascending sync_date
        order. Dates are inclusive YYYY-MM-DD values; raw readings are omitted unless
        include_readings=true.
      parameters:
