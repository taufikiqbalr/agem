          tz_offset_min: 420
          stage: light
          source: device
    SleepSegmentResponse:
      allOf:
      - $ref: '#/components/schemas/SleepSegment'
      - type: object
        required:
        - synced_at
        properties:
          synced_at:
            type: string
            format: date-time
    WorkoutLocation:
      type: object
      properties:
        rate_real:
          type: integer
      additionalProperties: false
    WorkoutRequest:
      type: object
      required:
      - start_utc
      properties:
        start_utc:
          type: string
          format: date-time
        end_utc:
          type: string
          format: date-time
        tz_offset_min:
          type: integer
        sport_type_id:
          type: integer
          nullable: true
        duration_s:
          type: integer
          nullable: true
        distance_m:
          type: integer
          nullable: true
        calories:
          type: number
          format: double
          nullable: true
        avg_hr:
          type: integer
          nullable: true
        max_hr:
          type: integer
          nullable: true
        min_hr:
          type: integer
          nullable: true
        avg_speed_cm_s:
          type: integer
          nullable: true
        max_speed_cm_s:
          type: integer
          nullable: true
        elevation_cm:
          type: integer
          nullable: true
        uphill_cm:
          type: integer
          nullable: true
        downhill_cm:
          type: integer
          nullable: true
        avg_cadence_spm:
          type: integer
          nullable: true
        sport_count:
          type: integer
          nullable: true
        steps:
          type: integer
          nullable: true
        locations:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutLocation'
        source:
          type: string
      additionalProperties: false
      example:
        start_utc: '2026-07-27T01:00:00Z'
        end_utc: '2026-07-27T01:30:00Z'
        tz_offset_min: 420
        sport_type_id: 1
        duration_s: 1800
        distance_m: 2500
        calories: 160.5
        avg_hr: 128
        max_hr: 150
        min_hr: 90
        steps: 3000
        locations:
        - rate_real: 128
        source: device
    WorkoutResponse:
      allOf:
      - $ref: '#/components/schemas/WorkoutRequest'
      - type: object
        required:
        - device_id
        - source
        - synced_at
        properties:
          device_id:
            type: string
          synced_at:
            type: string
            format: date-time
    WearableMetricSection:
      type: object
      properties:
        current:
          type: number
          format: double
        average:
          type: number
          format: double
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        raw:
          type: number
          format: double
        readingsCount:
          type: number
          format: double
        lastUpdated:
          type: string
          format: date-time
        readings:
          type: array
          items:
            $ref: '#/components/schemas/WearableMetricReading'
      additionalProperties: true
    WearableActivitySection:
      type: object
      properties:
        steps:
          type: number
          format: double
        calories:
          type: number
          format: double
        distance:
          type: number
          format: double
        activeTime:
          type: number
          format: double
