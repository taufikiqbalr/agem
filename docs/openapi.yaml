  /v3/users/{user_id}/wearable/range:
    get:
      tags:
      - Wearable v3
      summary: List user wearable snapshots
      description: Returns QRing-style daily wearable snapshots grouped by devices
        paired to the user. Dates are inclusive YYYY-MM-DD values; raw readings
        are omitted unless include_readings=true.
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/IncludeReadings'
      responses:
        '200':
          description: Wearable snapshot range grouped by paired devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWearableRangeResponse'
              example:
                user_id: 66a000000000000000000100
                from: '2026-07-01'
                to: '2026-07-27'
                devices:
                - user_device_id: 66a000000000000000000200
                  device_id: 66a000000000000000000001
                  deviceUid: qring-aa-bb-cc-01
                  nickname: daily ring
                  is_primary: true
                  paired_at: '2026-07-01T00:00:00Z'
                  items:
                  - date: '2026-07-27'
                    deviceUid: qring-aa-bb-cc-01
                    tzOffsetMin: 420
                    hrv:
                      current: 42
                      average: 45
                      readingsCount: 2
                      lastUpdated: '2026-07-27T23:44:10.512Z'
                    activity:
                      steps: 717
                      calories: 28390.0
                      distance: 493
                      activeTime: 29
                      lastUpdated: '2026-07-27T23:44:10.512Z'
                    totalActivities:
                    - kind: steps
                      value: 717.0
                      target: 4000.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: API document ID.
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
      description: User ID.
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
      description: Device ID.
    DeviceUID:
      name: device_uid
      in: path
      required: true
      schema:
        type: string
      description: Stable wearable UID or MAC address.
    Date:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Device-local date.
    FromTime:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Inclusive RFC3339 start timestamp.
    ToTime:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Exclusive RFC3339 end timestamp.
    FromDate:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Inclusive device-local start date.
    ToDate:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Inclusive device-local end date.
    Metric:
      name: metric
      in: query
      required: false
      schema:
        type: string
      description: Optional metric filter, for example heart_rate.
    EventType:
      name: event_type
      in: query
      required: false
      schema:
        type: string
      description: Optional event type filter, for example battery.
    StartUTC:
      name: start_utc
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Workout start timestamp.
    DeviceUIDQuery:
      name: device_uid
      in: query
      required: true
      schema:
        type: string
      description: Stable wearable UID. The camelCase alias deviceUid is also accepted.
    DeviceUIDCamelQuery:
      name: deviceUid
      in: query
      required: false
      schema:
        type: string
      description: Alias for device_uid.
    IncludeReadings:
      name: include_readings
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: When true, include raw readings and sleep segments in each returned
        snapshot.
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Deleted:
      description: Deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteResponse'
    Upserted:
      description: Ingest result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpsertResponse'
  schemas:
    HealthzResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: ok
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    DeleteResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: deleted
    UpsertResponse:
      type: object
      required:
      - upserted
      properties:
        upserted:
          type: integer
          format: int64
          minimum: 0
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        phone:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
      additionalProperties: false
      example:
        email: user@example.com
        phone: '+6281234567890'
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
      additionalProperties: false
      example:
        phone: '+6281312345678'
    Device:
      type: object
      required:
      - id
      - vendor
      - device_uid
      - first_seen_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
        vendor:
          type: string
        model:
          type: string
          nullable: true
        hw_rev:
          type: string
          nullable: true
        fw_rev:
          type: string
          nullable: true
        serial_number:
          type: string
          nullable: true
        device_uid:
          type: string
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateDeviceRequest:
      type: object
      required:
      - vendor
      - device_uid
      properties:
        vendor:
          type: string
        model:
          type: string
        hw_rev:
          type: string
        fw_rev:
          type: string
        serial_number:
          type: string
        device_uid:
          type: string
      additionalProperties: false
      example:
        vendor: QRing
        model: QRing Pro
        hw_rev: A1
        fw_rev: 1.0.0
        serial_number: QR-20260727-0001
        device_uid: qring-aa-bb-cc-01
    UpdateDeviceRequest:
      type: object
      properties:
        vendor:
          type: string
        model:
          type: string
        hw_rev:
          type: string
        fw_rev:
          type: string
        serial_number:
          type: string
        last_seen_at:
          type: string
          format: date-time
      additionalProperties: false
      example:
        fw_rev: 1.0.1
        last_seen_at: '2026-07-27T02:00:00Z'
    PairDeviceRequest:
      type: object
      required:
      - device_id
      properties:
        device_id:
          type: string
        nickname:
          type: string
        is_primary:
          type: boolean
      additionalProperties: false
      example:
        device_id: 66a000000000000000000001
        nickname: Daily QRing
        is_primary: true
    UpdateUserDeviceRequest:
      type: object
      properties:
        nickname:
          type: string
        is_primary:
          type: boolean
        unpaired_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
      example:
        nickname: Daily QRing Updated
        is_primary: true
        unpaired_at: '2026-07-27T12:00:00Z'
    UserDevice:
      type: object
      required:
      - id
      - user_id
      - device_id
      - is_primary
      - paired_at
      properties:
        id:
          type: string
        user_id:
          type: string
        device_id:
          type: string
        nickname:
          type: string
          nullable: true
        is_primary:
          type: boolean
        paired_at:
          type: string
          format: date-time
        unpaired_at:
          type: string
          format: date-time
          nullable: true
    Step15mPoint:
      type: object
      required:
      - ts_utc
      - device_date
      - time_index
      properties:
        ts_utc:
          type: string
          format: date-time
        device_date:
          type: string
          format: date
        time_index:
          type: integer
          minimum: 0
          maximum: 95
        tz_offset_min:
          type: integer
        walk_steps:
          type: integer
        run_steps:
          type: integer
        calories:
          type: integer
        distance_m:
          type: integer
        source:
          type: string
        sport_duration_s:
          type: integer
          description: Active duration in seconds for the 15-minute bucket.
      additionalProperties: false
      example:
        ts_utc: '2026-07-27T00:00:00Z'
        device_date: '2026-07-27'
        time_index: 0
        tz_offset_min: 420
        walk_steps: 120
        run_steps: 10
        calories: 8
        distance_m: 95
        source: device
        sport_duration_s: 600
    IngestSteps15mRequest:
      type: object
      required:
      - points
      properties:
        points:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Step15mPoint'
      additionalProperties: false
      example:
        points:
        - ts_utc: '2026-07-27T00:00:00Z'
          device_date: '2026-07-27'
          time_index: 0
          tz_offset_min: 420
          walk_steps: 120
          run_steps: 10
          calories: 8
          distance_m: 95
          source: device
    Steps15mResponse:
      allOf:
      - $ref: '#/components/schemas/Step15mPoint'
      - type: object
        required:
        - synced_at
        properties:
          synced_at:
            type: string
            format: date-time
      properties:
        sport_duration_s:
          type: integer
          description: Active duration in seconds for the 15-minute bucket.
      example:
        sport_duration_s: 600
    StepsDailyRow:
      type: object
      properties:
        day_utc:
          type: string
          format: date-time
        total_steps:
          type: integer
          format: int64
        running_steps:
          type: integer
          format: int64
        calories:
          type: integer
          format: int64
        distance_m:
          type: integer
          format: int64
        last_synced_at:
          type: string
          format: date-time
    DailyActivityRequest:
      type: object
      required:
      - device_date
      properties:
        device_date:
          type: string
          format: date
        tz_offset_min:
          type: integer
        total_steps:
          type: integer
        running_steps:
          type: integer
        calories:
          type: integer
        walk_distance_m:
          type: integer
        sport_duration_s:
          type: integer
        sleep_duration_s:
          type: integer
        source:
          type: string
      additionalProperties: false
      example:
        device_date: '2026-07-27'
        tz_offset_min: 420
        total_steps: 130
        running_steps: 10
        calories: 8
        walk_distance_m: 95
        sport_duration_s: 600
        sleep_duration_s: 25200
        source: device
    DailyActivityResponse:
      allOf:
      - $ref: '#/components/schemas/DailyActivityRequest'
      - type: object
        required:
        - device_id
        - synced_at
        properties:
          device_id:
            type: string
          synced_at:
            type: string
            format: date-time
    HealthMetricPoint:
      type: object
      required:
      - ts_utc
      - metric
      properties:
        ts_utc:
          type: string
          format: date-time
        metric:
          type: string
          example: heart_rate
        value:
          type: number
          format: double
          nullable: true
        values:
          type: object
          additionalProperties:
            type: number
            format: double
        unit:
          type: string
          example: bpm
        source:
          type: string
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: false
      example:
        ts_utc: '2026-07-27T00:05:00Z'
        metric: heart_rate
        value: 72
        unit: bpm
        source: device
        metadata:
          wearing: true
    IngestHealthMetricsRequest:
      type: object
      required:
      - points
      properties:
        points:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/HealthMetricPoint'
      additionalProperties: false
      example:
        points:
        - ts_utc: '2026-07-27T00:05:00Z'
          metric: heart_rate
          value: 72
          unit: bpm
          source: device
          metadata:
            wearing: true
    HealthMetricResponse:
      allOf:
      - $ref: '#/components/schemas/HealthMetricPoint'
      - type: object
        required:
        - device_id
        - source
        - synced_at
        properties:
          device_id:
            type: string
          synced_at:
            type: string
            format: date-time
    DeviceEventPoint:
      type: object
      required:
      - ts_utc
      - event_type
      properties:
        ts_utc:
          type: string
          format: date-time
        event_type:
          type: string
          example: battery
        source:
          type: string
        payload:
          type: object
          additionalProperties: true
      additionalProperties: false
      example:
        ts_utc: '2026-07-27T00:10:00Z'
        event_type: battery
        source: device
        payload:
          level: 88
          charging: false
    IngestDeviceEventsRequest:
      type: object
      required:
      - events
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DeviceEventPoint'
      additionalProperties: false
      example:
        events:
        - ts_utc: '2026-07-27T00:10:00Z'
          event_type: battery
          source: device
          payload:
            level: 88
            charging: false
    DeviceEventResponse:
      allOf:
      - $ref: '#/components/schemas/DeviceEventPoint'
      - type: object
        required:
        - device_id
        - source
        - synced_at
        properties:
          device_id:
            type: string
          synced_at:
            type: string
            format: date-time
    SleepSummaryRequest:
      type: object
      required:
      - sleep_date
      properties:
        sleep_date:
          type: string
          format: date
        tz_offset_min:
          type: integer
        sleep_start_utc:
          type: string
          format: date-time
        wake_utc:
          type: string
          format: date-time
        total_sleep_s:
          type: integer
        deep_s:
          type: integer
        light_s:
          type: integer
        awake_s:
          type: integer
        rem_s:
          type: integer
        source:
          type: string
      additionalProperties: false
      example:
        sleep_date: '2026-07-27'
        tz_offset_min: 420
        sleep_start_utc: '2026-07-26T15:00:00Z'
        wake_utc: '2026-07-26T22:00:00Z'
        total_sleep_s: 25200
        deep_s: 5400
        light_s: 14400
        awake_s: 900
        rem_s: 4500
        source: device
    SleepSummaryResponse:
      allOf:
      - $ref: '#/components/schemas/SleepSummaryRequest'
      - type: object
        required:
        - device_id
        - synced_at
        properties:
          device_id:
            type: string
          synced_at:
            type: string
            format: date-time
          score:
            type: integer
            nullable: true
          stage_data:
            type: array
            items:
              type: integer
    SleepSegment:
      type: object
      required:
      - start_utc
      - end_utc
      - sleep_date
      properties:
        start_utc:
          type: string
          format: date-time
        end_utc:
          type: string
          format: date-time
        sleep_date:
          type: string
          format: date
        tz_offset_min:
          type: integer
        stage:
          type: string
          enum:
          - deep
          - light
          - rem
          - awake
          - off_wrist
          - unknown
        source:
          type: string
      additionalProperties: false
      example:
        start_utc: '2026-07-26T15:00:00Z'
        end_utc: '2026-07-26T15:30:00Z'
        sleep_date: '2026-07-27'
        tz_offset_min: 420
        stage: light
        source: device
    IngestSleepSegmentsRequest:
      type: object
      required:
      - segments
