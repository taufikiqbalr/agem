info:
  contact: {}
  description: Backend API for AGEM wearable users, devices, qring sensor data, sleep,
    and workouts.
  title: AGEM Backend API
  version: "1.0"
paths:
  /healthz:
    get:
      description: Returns service health status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - Health
  /v1/devices/:
    post:
      consumes:
      - application/json
      description: Creates a wearable device registry record.
      parameters:
      - description: Device payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateDeviceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.DeviceRow'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Create device
      tags:
      - Devices
  /v1/devices/{device_id}/activity/daily:
    get:
      description: Lists device-local daily activity summaries in an inclusive date
        range.
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      - description: Inclusive device-local start date
        format: date
        in: query
        name: from
        required: true
        type: string
      - description: Inclusive device-local end date
        format: date
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.DailyActivityResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List daily activity
      tags:
      - Daily Activity
    post:
      consumes:
      - application/json
      description: Creates or updates one device-local daily activity summary for
        a device.
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      - description: Daily activity payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.DailyActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.DailyActivityResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Upsert daily activity
      tags:
      - Daily Activity
  /v1/devices/{device_id}/events:
    get:
      description: Lists device events in an RFC3339 time range, optionally filtered
        by event type.
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      - description: Event type filter
        in: query
        name: event_type
        type: string
      - description: Inclusive RFC3339 start timestamp
        format: date-time
        in: query
        name: from
        required: true
        type: string
      - description: Exclusive RFC3339 end timestamp
        format: date-time
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.DeviceEventResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List device events
      tags:
      - Device Events
    post:
      consumes:
      - application/json
      description: Idempotently ingests device events such as sync markers, battery
        state, binding events, or SDK notifications.
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      - description: Device event payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.IngestDeviceEventsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UpsertResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Ingest device events
      tags:
      - Device Events
