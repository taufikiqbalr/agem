      device_uid:
        type: string
      first_seen_at:
        type: string
      fw_rev:
        type: string
      hw_rev:
        type: string
      id:
        type: string
      last_seen_at:
        type: string
      model:
        type: string
      serial_number:
        type: string
      updated_at:
        type: string
      vendor:
        type: string
