basePath: /
definitions:
  handlers.CreateDeviceRequest:
    properties:
      device_uid:
        description: remoteId/MAC stable identifier
        type: string
      fw_rev:
        type: string
      hw_rev:
        type: string
      model:
        type: string
      serial_number:
        type: string
      vendor:
        type: string
    type: object
  handlers.CreateUserRequest:
    properties:
      email:
        type: string
      phone:
        type: string
    type: object
  handlers.DailyActivityRequest:
    properties:
      calories:
        type: integer
      device_date:
        type: string
      running_steps:
        type: integer
      sleep_duration_s:
        type: integer
      source:
        type: string
      sport_duration_s:
        type: integer
      total_steps:
        type: integer
      tz_offset_min:
        type: integer
      walk_distance_m:
        type: integer
    type: object
  handlers.DeviceEventPoint:
    properties:
      event_type:
        type: string
      payload:
        additionalProperties: {}
        type: object
      source:
        type: string
      ts_utc:
        type: string
    type: object
  handlers.HealthMetricPoint:
    properties:
      metadata:
        additionalProperties: {}
        type: object
      metric:
        type: string
      source:
        type: string
      ts_utc:
        type: string
      unit:
        type: string
      value:
        type: number
      values:
        additionalProperties:
          format: float64
          type: number
        type: object
    type: object
  handlers.IngestDeviceEventsRequest:
    properties:
      events:
        items:
          $ref: '#/definitions/handlers.DeviceEventPoint'
        type: array
    type: object
  handlers.IngestHealthMetricsRequest:
    properties:
      points:
        items:
          $ref: '#/definitions/handlers.HealthMetricPoint'
        type: array
    type: object
  handlers.IngestSleepSegmentsRequest:
    properties:
      segments:
        items:
          $ref: '#/definitions/handlers.SleepSegment'
        type: array
    type: object
  handlers.IngestSteps15mRequest:
    properties:
      points:
        items:
          $ref: '#/definitions/handlers.Step15mPoint'
        type: array
    type: object
  handlers.PairDeviceRequest:
    properties:
      device_id:
        type: string
      is_primary:
        type: boolean
      nickname:
        type: string
    type: object
  handlers.SleepSegment:
    properties:
      end_utc:
        description: RFC3339
        type: string
      sleep_date:
        description: YYYY-MM-DD
        type: string
      source:
        type: string
      stage:
        description: deep/light/rem/awake/off_wrist/unknown
        type: string
      start_utc:
        description: RFC3339
        type: string
      tz_offset_min:
        type: integer
    type: object
  handlers.SleepSummaryRequest:
    properties:
      awake_s:
        type: integer
      deep_s:
        type: integer
      light_s:
        type: integer
      rem_s:
        type: integer
      sleep_date:
        description: YYYY-MM-DD (device-local night)
        type: string
      sleep_start_utc:
        description: RFC3339 optional
        type: string
      source:
        type: string
      total_sleep_s:
        type: integer
      tz_offset_min:
        type: integer
      wake_utc:
        description: RFC3339 optional
        type: string
    type: object
  handlers.StatusResponse:
    properties:
      status:
        example: deleted
        type: string
    type: object
  handlers.Step15mPoint:
    properties:
      calories:
        type: integer
      device_date:
        description: YYYY-MM-DD (device-local)
        type: string
      distance_m:
        type: integer
      run_steps:
        type: integer
      source:
        description: device/derived/manual/import (optional)
        type: string
      sport_duration_s:
        description: active duration in seconds
        type: integer
      time_index:
        description: 0..95
        type: integer
      ts_utc:
        description: RFC3339
        type: string
      tz_offset_min:
        type: integer
      walk_steps:
        type: integer
    type: object
  handlers.UpdateDeviceRequest:
    properties:
      fw_rev:
        type: string
      hw_rev:
        type: string
      last_seen_at:
        description: RFC3339
        type: string
      model:
        type: string
      serial_number:
        type: string
      vendor:
        type: string
    type: object
  handlers.UpdateUserDeviceRequest:
    properties:
      is_primary:
        type: boolean
      nickname:
        type: string
      unpaired_at:
        description: RFC3339 or null
        type: string
    type: object
  handlers.UpdateUserRequest:
    properties:
      email:
        type: string
      phone:
        type: string
    type: object
  handlers.UpsertResponse:
    properties:
      upserted:
        example: 1
        type: integer
    type: object
  handlers.WorkoutRequest:
    properties:
      avg_cadence_spm:
        type: integer
      avg_hr:
        type: integer
      avg_speed_cm_s:
        type: integer
      calories:
        type: number
      distance_m:
        type: integer
      downhill_cm:
        type: integer
      duration_s:
        type: integer
      elevation_cm:
        type: integer
      end_utc:
        description: RFC3339 optional
        type: string
      locations:
        items:
          $ref: '#/definitions/store.WorkoutLocation'
        type: array
      max_hr:
        type: integer
      max_speed_cm_s:
        type: integer
      min_hr:
        type: integer
      source:
        type: string
      sport_count:
        type: integer
      sport_type_id:
        type: integer
      start_utc:
        description: RFC3339
        type: string
      steps:
        type: integer
      tz_offset_min:
        type: integer
      uphill_cm:
        type: integer
    type: object
  httpx.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  store.DailyActivityResponse:
    properties:
      calories:
        type: integer
      device_date:
        type: string
      device_id:
        type: string
      running_steps:
        type: integer
      sleep_duration_s:
        type: integer
      source:
        type: string
      sport_duration_s:
        type: integer
      synced_at:
        type: string
      total_steps:
        type: integer
      tz_offset_min:
        type: integer
      walk_distance_m:
        type: integer
    type: object
  store.DeviceEventResponse:
    properties:
